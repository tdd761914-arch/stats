name: Telegram Bot API benchmark

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      samples:
        description: "Latency samples per method and bot"
        required: false
        default: "5"
        type: string

concurrency:
  group: benchmark-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout stats
        uses: actions/checkout@v4

      - name: Checkout TRBotApi
        uses: actions/checkout@v4
        with:
          repository: tdd761914-arch/TRBotApi
          path: trbotapi
          fetch-depth: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build TRBotApi release
        working-directory: trbotapi
        run: cargo build --release --locked -p trbotapi-server

      - name: Run benchmark (secrets stay in the process environment)
        env:
          TRBOTAPI_BOT_TOKEN_A: ${{ secrets.TRBOTAPI_BOT_TOKEN_A }}
          TRBOTAPI_BOT_TOKEN_B: ${{ secrets.TRBOTAPI_BOT_TOKEN_B }}
          TRBOTAPI_API_ID: ${{ secrets.TRBOTAPI_API_ID }}
          TRBOTAPI_API_HASH: ${{ secrets.TRBOTAPI_API_HASH }}
          TRBOTAPI_CHAT_ID: ${{ secrets.TRBOTAPI_CHAT_ID }}
          BENCHMARK_SAMPLES: ${{ inputs.samples || '5' }}
        run: |
          python3 scripts/benchmark.py \
            --trbotapi-dir "$GITHUB_WORKSPACE/trbotapi" \
            --history data/benchmarks.json

      - name: Commit benchmark history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/benchmarks.json
          if git diff --cached --quiet; then
            echo "No benchmark data change"
          else
            git commit -m "chore: record benchmark $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Prepare static Pages artifact
        run: |
          rm -rf site
          mkdir -p site/data
          cp index.html site/index.html
          cp data/benchmarks.json site/data/benchmarks.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: benchmark
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
